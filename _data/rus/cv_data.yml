      - Реализовал потоки с электронной подписью для кредитных документов, увеличив выдачу кредитов в три раза.
      - Обеспечил повторное использование отклонённых заявок в других потоках, увеличив одобрения примерно на 10%.
      - Разработал базовое банковское ПО для одного из крупнейших финансовых учреждений страны.

  - period:
