    company: AlfaBank
    position: "Ведущий разработчик"
    description:
      - Реализовал критически важный функционал биометрии для соответствия новым регуляторным требованиям, включая двустороннюю интеграцию с Единой биометрической системой (ЕБС).
      - Внедрил загрузку биометрических данных и использование векторов из ЕБС.
      #      - Параллелизовал конвейеры обработки, разделив создание векторов и обработку метаданных, что повысило пропускную способность и отказоустойчивость.
      - Перевёл микросервисы на Java 21+ и Spring Boot 3.x; добавил модульные и интеграционные тесты, настроил сборки в Jenkins.
      - Улучшил мониторинг и реагирование на инциденты за счёт структурированных логов (в т.ч. FluentBit).
      - "Выполнял роль Scrum-мастера: проводил Agile-церемонии и управлял бэклогом для повышения темпа поставок."
      - "Обеспечил работу биометрических функций в продакшене: очередь в отделениях, биометрические платежи (био-эквайринг), обнаружение мошенничества и подтверждения операций сотрудниками."

