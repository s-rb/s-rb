name: Роман Сурков
job-title: Senior Software Engineer

description:
  - "Backend-разработчик на Java, создающий высокопроизводительные API, масштабируемые микросервисы и бесшовные интеграции для финтеха, банковских и государственных систем."
  - "Эксперт в Java 17+ и Spring Boot, ориентированный на чистый и поддерживаемый код; имею опыт модернизации устаревших систем, оптимизации производительности и обеспечения отказоустойчивости при высоких нагрузках. Владею тестированием, CI/CD и наблюдаемостью для выпуска безопасных, стабильных и готовых к эксплуатации релизов."
  - "Создатель Jeeker.one — AI-помощника по поиску работы, демонстрирующего навыки в Java, Spring Boot и интеграции сложных систем."
  - "Открыт к релокации или удалённой работе, готов применить свой опыт в международной команде и внести вклад в создание значимых инновационных продуктов."

selected_achievements:
  - "Досрочно внедрил критически важную биометрическую интеграцию с Единой биометрической системой (ЕБС) России, обеспечив биометрические платежи, обнаружение мошенничества и соответствие регуляторным требованиям."
  - "Разработал и внедрил процессы выдачи кредитов с электронной подписью, что позволило увеличить объём выдач в три раза и значительно улучшить клиентский опыт."
  - "Запустил системы кредитования автомобильных дилерских центров, открыв новые источники дохода и укрепив партнёрские отношения."
  - "Перевёл ключевые микросервисы на Java 17+ и Spring Boot 3.x, повысив поддерживаемость, масштабируемость и производительность; внедрил автоматическое тестирование и CI/CD-пайплайны."
  - "Создал и опубликовал Jeeker — AI-платформу для поиска работы с интеллектуальным парсингом вакансий, сопоставлением профиля и вакансии, а также автоматической генерацией сопроводительных писем. Попробуйте на https://jeeker.one"

core-competencies:
  - Java 17+
  - Kotlin
  - Spring&nbsp;Framework
  - Microservices
  - REST API
  - PostgreSQL
  - MongoDB
  - Docker
  - Git
  - CI/CD
  - Jenkins
  - JUnit/Mockito
  - Kafka
  - RabbitMQ
  - ELK/Kibana
  - FinTech
  - Agile
  - Scrum

