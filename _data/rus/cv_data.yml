      finished: '09.2021'
    company: Codemark
    position: Бэкенд-разработчик
    description:
      - Разрабатывал бэкенд-модули для портала спортивной федерации и избирательных систем.
      - Реализовал нечёткий поиск (сходство векторов и триграммы) и автоматическую загрузку данных с проверкой качества.
#Разрабатывал бэкенд портала спортивной федерации и приложение для работы с базой данных государственной избирательной системы. Реализовал полнотекстовый поиск (по векторам) в базе данных PostgreSQL. Создал приближённый поиск по множеству параметров с использованием функции сходства на основе триграмм в базе данных с возможностью задания произвольной точности поиска. Это упростило ввод данных операторами о пользователях, поиск пользователей и исправление ошибок в большом объёме персональных данных. Кроме того, разработал функциональность массового создания записей о клиентах на основе загруженных текстовых данных после прохождения контроля качества, который также был выполнен мной.

