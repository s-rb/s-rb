      - "Поддерживал и развивал функциональность флагманского банковского продукта компании."
      - "Реализовал многопоточный приём рыночных данных с биржи KASE: обработка мультикаст UDP, дедупликация и обеспечение отказоустойчивости."
#      Участвовал в поддержке основного продукта компании — банковского ПО для различных банков по всему миру. Модернизировал его, перенося логику из хранимых процедур базы данных в Java-микросервисы. Разработал сервис для приёма мультикаст-данных с биржи в многопоточном режиме из нескольких каналов с исключением дублирующих сообщений, контролем пропусков и реализацией другой бизнес-логики. Это позволило клиентам (банкам) предоставлять расширенный спектр услуг.
  - period:
