- name: Jeeker - AI Job Seeker
  link: https://jeeker.one
  image: assets/images/projects/JeekerScreenshot.png
  description: |
    Jeeker — это полнофункциональная платформа для автоматизации поиска работы на основе ИИ. Пользователи задают параметры поиска, 
    система непрерывно сканирует вакансии, анализирует их с помощью ИИ-моделей в сопоставлении с загруженными резюме и вычисляет 
    степень соответствия. Она имитирует работу HR-специалиста, предоставляя умные рекомендации и готовые сопроводительные письма 
    в один клик. 
    Разработана на Spring Boot 3, Java 21 и Vaadin 24 для UI, бэкенд использует PostgreSQL, LangChain для AI-операций, RabbitMQ для 
    асинхронной обработки, полностью контейнеризирована в Docker.
  links:
    - name: Try it!
      link: https://jeeker.one
      description: Веб-платформа для автоматизации и оптимизации поиска работы с использованием ИИ

- name: Blog Backend Application
  link: https://blog.surkoff.com
  image: assets/images/projects/BlogFrontEnd.png
  description: |
    Движок бэкенда для блоговой платформы с регистрацией пользователей (подтверждение по email и CAPTCHA), созданием постов, 
    комментариями и лайками. 
    Реализован на Java 11, Spring Framework и MySQL. Включает модульное тестирование через JUnit, отправку писем через Jakarta Mail, 
    и CAPTCHA с помощью Cage.
  links:
    - name: Try it!
      link: https://blog.surkoff.com
      description: Действующая блог-платформа (фронтенд + бэкенд)
    - name: Исходный код бэкенда
      link: https://github.com/s-rb/blog-engine

